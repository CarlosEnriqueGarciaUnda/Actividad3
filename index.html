<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevModal.js - Componente Visual</title>
    <link rel="stylesheet" href="css/devmodal.css">
</head>
<body>
    <div class="demo-container">
        <header class="demo-header">
            <h1>DevModal.js</h1>
            <p>Componente visual reutilizable tipo IDE para aplicaciones web de desarrollo.</p>
        </header>

        <main class="card-grid">
            <div class="card" id="card-perfil">
                <h3>Perfil Developer</h3>
                <p>Muestra información en formato Markdown.</p>
            </div>

            <div class="card" id="card-json">
                <h3>Configuración JSON</h3>
                <p>Estructura de respuesta de API.</p>
            </div>

            <div class="card" id="card-error">
                <h3>Log de Error</h3>
                <p>Visualización de fallos con tema crítico.</p>
            </div>
        </main>
    </div>

    <script src="js/DevModal.js"></script>
</body>
</html>
